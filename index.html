<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#2A4A7B" />
    <title>Lingua</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <meta property="og:title" content="Lingua" />
    <meta property="og:description" content="Learn languages by climbing a ladder — clear reviews, take a lesson, prove it." />
    <meta property="og:image" content="/logo/preview-rounded.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:image" content="/logo/preview-rounded.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&amp;family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+JP:wght@400;500;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; }
      /* The document itself NEVER scrolls. The app is a fixed shell -- pinned top
         bar + pinned bottom nav -- and the only scroller is <main> inside
         AppShell/PhaseShell. overflow:hidden here is what keeps a swipe from
         dragging the whole shell, bars included; overscroll-behavior kills the
         rubber-band on top of that. */
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; overscroll-behavior: none; }
      /* Must divide by --app-zoom exactly like the shells do (AppShell.jsx,
         PhaseShell.jsx). Text size is applied as `zoom` on <html>, which scales
         every length -- so a plain 100dvh here lays out one viewport tall and then
         renders --app-zoom times taller than the screen (5% at default, 20% at
         large). That leftover was real scrollable overflow on the document, which
         is exactly the drag: the header and bottom nav went with it. */
      #root { height: calc(100dvh / var(--app-zoom, 1)); }
      body { -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
      button { font-family: inherit; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
